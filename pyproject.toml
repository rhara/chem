[project]
name = "chem"
version = "0.1.0"
description = "Chemistry utilities for interactive use in Jupyter notebooks"
requires-python = ">=3.12"
readme = "README.md"
# rdkit, py3dmol, tqdm, biopython, numpy have official PyPI wheels, so they're safe
# to list here. ambertools, nglview, and fpocket are installed via environment.yml
# (conda-forge) instead: ambertools and fpocket have no PyPI package at all, and
# nglview's JupyterLab widget assets are more reliably wired up through the
# conda-forge build.
dependencies = [
    "rdkit",
    "py3dmol",
    "tqdm",
    "requests",
    "chembl_structure_pipeline",
    "biopython",
    "numpy",
]

[project.optional-dependencies]
# Jupyter itself: needed to actually run/display notebooks, not to use chem as a library.
notebook = ["jupyter", "jupyterlab", "notebook", "ipykernel", "ipywidgets", "nglview", "pandas"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
